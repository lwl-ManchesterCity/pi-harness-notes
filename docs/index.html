</style></head><body><canvas id="graph" aria-label="Pi 源码学习网络"></canvas><header class="top"><h1>Pi 源码学习网络</h1><p>已学习的调用链 · Week 1—4</p><div class="legend"><span style="--c:#32618a">核心流程</span><span style="--c:#f0784f">工具与 Hook</span><span style="--c:#8c91aa">状态与数据</span></div></header><input class="search" id="search" placeholder="搜索节点，例如 Tool" aria-label="搜索节点"><div class="controls"><button id="reset">适应画布</button><button id="motion">暂停布局</button></div><aside class="panel" id="panel"><span class="tag">开始探索</span><h2>点击一个节点</h2><p>查看它的职责、关联节点和源码位置。</p><p class="hint">拖动节点调整位置 · 拖动画布平移 · 滚轮缩放</p></aside><script>
// Each entry can be extended as the learning journey progresses: id, category, explanation and source.
const nodes=[
['cli','CLI 启动','flow','解析启动参数，创建运行时服务并进入交互、打印或 RPC 模式。','packages/coding-agent/src/main.ts'],
['services','Session 服务','flow','创建工作目录绑定的设置、模型运行时和资源加载器，再交给会话创建流程。','packages/coding-agent/src/core/agent-session-services.ts'],
['sdk','createAgentSession','flow','创建底层 Agent 与 AgentSession，并注入会话所需的服务。','packages/coding-agent/src/core/sdk.ts'],
['session','AgentSession','flow','接收用户输入，准备并启动 Agent 运行；处理运行后续状态。','packages/coding-agent/src/core/agent-session.ts'],
['manager','SessionManager','data','维护 session 记录与分支；根据当前分支构建会话上下文。','packages/coding-agent/src/core/session-manager.ts'],
['agent','Agent','flow','持有模型、工具和消息状态，通过 prompt 启动 Agent Loop。','packages/agent/src/agent.ts'],
['loop','Agent Loop','flow','请求模型、处理工具调用与结果，并在需要时继续下一轮。','packages/agent/src/agent-loop.ts'],
['stream','模型请求','flow','流式读取 assistant 回复，包括文本、思考和工具调用事件。','packages/agent/src/agent-loop.ts'],
['convert','convertToLlm','data','将 Pi 的 AgentMessage 转换为模型请求使用的消息。','packages/coding-agent/src/core/messages.ts'],
['calls','Tool Call 批次','tool','从 assistant 回复提取工具调用，选择顺序或并行执行。','packages/agent/src/agent-loop.ts'],
['prepare','prepareToolCall','tool','查找真实 Tool、预处理和校验参数，执行 beforeToolCall；可直接返回错误。','packages/agent/src/agent-loop.ts'],
['before','beforeToolCall','tool','工具执行前的控制点，可检查调用并阻止执行。','packages/agent/src/agent-loop.ts'],
['parallel','并行执行','tool','按顺序准备各调用，随后启动待执行函数；结果按原调用顺序整理。','packages/agent/src/agent-loop.ts'],
['execute','executePreparedToolCall','tool','调用 Tool.execute，处理部分更新、取消、结果和耗时。','packages/agent/src/agent-loop.ts'],
['update','partial update','data','工具运行时的部分结果；已开始的更新会在最终返回前等待完成。','packages/agent/src/agent-loop.ts'],
['after','afterToolCall','tool','工具执行后可查看并覆盖结果或错误状态。','packages/agent/src/agent-loop.ts'],
['result','toolResult','data','将最终执行结果封装为消息，加入上下文供后续模型请求处理。','packages/agent/src/agent-loop.ts'],
['tools','内置 Tool','tool','已阅读工具目录：read、bash、powershell、edit、write、grep、find、ls。','packages/coding-agent/src/core/tools/index.ts'],
['read','read Tool','tool','创建 read 工具定义；当前读到工作目录和可选配置，执行细节待继续学习。','packages/coding-agent/src/core/tools/read.ts'],
['context','上下文投影','data','从当前分支整理上下文，应用压缩记录和 context_edit。','packages/coding-agent/src/core/session-manager.ts'],
['queues','消息队列','data','steering 与 follow-up 在 Agent Loop 的不同位置进入后续运行。','packages/agent/src/agent-loop.ts']
].map((v,i)=>({id:v[0],label:v[1],group:v[2],description:v[3],path:v[4],x:Math.cos(i*2.4)*(120+i*8),y:Math.sin(i*2.4)*(100+i*6),vx:0,vy:0}));
const links=[['cli','services','创建'],['services','sdk','交给'],['sdk','session','创建'],['sdk','agent','创建'],['session','manager','使用'],['session','agent','启动'],['manager','context','构建'],['agent','loop','启动'],['loop','stream','请求'],['stream','convert','转换'],['loop','calls','处理'],['loop','queues','读取'],['calls','prepare','准备'],['prepare','before','检查'],['calls','parallel','可并行'],['parallel','execute','启动'],['execute','update','上报'],['execute','after','执行后'],['after','result','生成'],['result','loop','回传'],['tools','read','创建'],['prepare','tools','查找']].map(([a,b,label])=>({a:nodes.find(n=>n.id===a),b:nodes.find(n=>n.id===b),label}));
const canvas=document.querySelector('#graph'),ctx=canvas.getContext('2d'),panel=document.querySelector('#panel');let w,h,dpr,scale=1,ox=0,oy=0,selected=null,drag=null,pan=null,moving=true,query='';const colors={flow:'#32618a',tool:'#f0784f',data:'#8c91aa'};
function resize(){dpr=devicePixelRatio||1;w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}function reset(){scale=Math.min(1,Math.max(.55,Math.min(w/1100,h/800)));ox=w*.46;oy=h*.51}function screen(n){return{x:n.x*scale+ox,y:n.y*scale+oy}}function hit(x,y){return [...nodes].reverse().find(n=>{let p=screen(n);return Math.hypot(p.x-x,p.y-y)<Math.max(12,12*scale)})}
function detail(n){selected=n;const near=links.filter(l=>l.a===n||l.b===n).map(l=>l.a===n?`${l.label} → ${l.b.label}`:`${l.a.label} → ${l.label}`);panel.innerHTML=`<button class="close" aria-label="关闭">×</button><span class="tag">${{flow:'核心流程',tool:'工具与 Hook',data:'状态与数据'}[n.group]}</span><h2></h2><p></p><div class="related"><b>关联</b><p></p><b>源码位置</b><p><a href=""></a></p></div><p class="hint">拖动节点可调整位置</p>`;panel.querySelector('h2').textContent=n.label;panel.querySelector('p').textContent=n.description;panel.querySelector('.related p').textContent=near.join(' · ');let a=panel.querySelector('a');a.href='https://github.com/earendil-works/pi/blob/9de51de45cd86ce831d271f187afd9450bf3b7ba/'+n.path;a.textContent=n.path; a.target='_blank';a.rel='noopener';panel.querySelector('.close').onclick=()=>{selected=null;panel.hidden=true};panel.hidden=false}
function tick(){if(moving){for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){let a=nodes[i],b=nodes[j],dx=b.x-a.x||.1,dy=b.y-a.y||.1,d=Math.max(20,Math.hypot(dx,dy)),f=1100/(d*d);a.vx-=dx/d*f;a.vy-=dy/d*f;b.vx+=dx/d*f;b.vy+=dy/d*f}for(const l of links){let dx=l.b.x-l.a.x,dy=l.b.y-l.a.y,d=Math.max(1,Math.hypot(dx,dy)),f=(d-150)*.0018;l.a.vx+=dx/d*f;l.a.vy+=dy/d*f;l.b.vx-=dx/d*f;l.b.vy-=dy/d*f}for(const n of nodes){n.vx=(n.vx-n.x*.0005)*.88;n.vy=(n.vy-n.y*.0005)*.88;if(drag!==n){n.x+=n.vx;n.y+=n.vy}}}ctx.clearRect(0,0,w,h);ctx.fillStyle='#cfd7df';for(let x=((ox%30)+30)%30;x<w;x+=30)for(let y=((oy%30)+30)%30;y<h;y+=30){ctx.beginPath();ctx.arc(x,y,.8,0,7);ctx.fill()}for(const l of links){const a=screen(l.a),b=screen(l.b),active=selected&&(l.a===selected||l.b===selected);ctx.strokeStyle=active?'#ef8669':'#cfd6de';ctx.globalAlpha=selected&&!active?.2:.8;ctx.lineWidth=active?1.8:1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();if(active){ctx.fillStyle='#b04e35';ctx.font='11px sans-serif';ctx.fillText(l.label,(a.x+b.x)/2,(a.y+b.y)/2-5)}}ctx.globalAlpha=1;for(const n of nodes){const p=screen(n),match=!query||n.label.toLowerCase().includes(query)||n.description.toLowerCase().includes(query);ctx.globalAlpha=match?1:.12;ctx.fillStyle=colors[n.group];ctx.beginPath();ctx.arc(p.x,p.y,(n===selected?8:5)*Math.max(.8,scale),0,7);ctx.fill();ctx.fillStyle='#47576a';ctx.font=`${Math.max(11,12*scale)}px sans-serif`;ctx.fillText(n.label,p.x+10,p.y+4)}ctx.globalAlpha=1;requestAnimationFrame(tick)}
canvas.addEventListener('pointerdown',e=>{let n=hit(e.clientX,e.clientY);canvas.setPointerCapture(e.pointerId);canvas.classList.add('dragging');if(n){drag=n;detail(n)}else pan={x:e.clientX,y:e.clientY,ox,oy}});canvas.addEventListener('pointermove',e=>{if(drag){drag.x=(e.clientX-ox)/scale;drag.y=(e.clientY-oy)/scale;drag.vx=drag.vy=0}else if(pan){ox=pan.ox+e.clientX-pan.x;oy=pan.oy+e.clientY-pan.y}});canvas.addEventListener('pointerup',()=>{drag=null;pan=null;canvas.classList.remove('dragging')});canvas.addEventListener('wheel',e=>{e.preventDefault();const old=scale;scale=Math.max(.3,Math.min(3,scale*Math.exp(-e.deltaY*.001)));ox=e.clientX-(e.clientX-ox)*scale/old;oy=e.clientY-(e.clientY-oy)*scale/old},{passive:false});document.querySelector('#reset').onclick=reset;document.querySelector('#motion').onclick=e=>{moving=!moving;e.target.textContent=moving?'暂停布局':'继续布局'};document.querySelector('#search').oninput=e=>query=e.target.value.trim().toLowerCase();addEventListener('resize',resize);resize();reset();tick();
</script></body></html>
