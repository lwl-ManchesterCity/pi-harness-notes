<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pi 源码学习网络</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#233044}*{box-sizing:border-box}body{margin:0;background:#f7f8fa}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}canvas.dragging{cursor:grabbing}.top{position:fixed;top:24px;left:28px;pointer-events:none}.top h1{font-size:21px;margin:0 0 6px}.top p{font-size:12px;color:#708093;margin:0}.controls{position:fixed;bottom:25px;left:28px;display:flex;gap:8px}button,input{border:1px solid #e1e6eb;background:white;border-radius:9px;padding:10px 13px;color:#34465c;font:inherit}button{cursor:pointer}.panel{position:fixed;right:24px;top:24px;width:330px;max-width:calc(100% - 48px);background:#fff;border:1px solid #e7eaef;border-radius:16px;padding:22px;box-shadow:0 12px 44px #23304412}.panel .tag{font-size:11px;color:#f06c41;font-weight:700}.panel h2{font-size:22px;margin:8px 0}.panel p{line-height:1.75;font-size:14px;color:#526276}.panel .related{border-top:1px solid #eee;padding-top:12px;font-size:13px}.panel a{color:#2466a2;overflow-wrap:anywhere}.close{position:absolute;right:13px;top:12px;border:0;font-size:20px;padding:3px 8px}.legend{display:flex;gap:12px;font-size:12px;color:#718093;margin-top:14px}.legend span:before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:5px}.hint{color:#8e9aa7;font-size:12px}.search{position:fixed;top:24px;left:50%;transform:translateX(-50%);width:220px}.empty{color:#82909c}@media(max-width:700px){.search{top:auto;bottom:25px;left:auto;right:20px;transform:none;width:160px}.panel{top:80px;width:270px}.top{left:18px;top:18px}}
.weeks{position:fixed;top:105px;left:28px;display:flex;gap:8px}.weeks a{background:#fff;border:1px solid #e1e6eb;border-radius:8px;padding:7px 10px;color:#34465c;text-decoration:none;font-size:13px}@media(max-width:700px){.weeks{top:112px;left:18px}}
</style></head><body><canvas id="graph" aria-label="Pi 源码学习网络"></canvas><header class="top"><h1>Pi 源码学习网络</h1><p>沿主线阅读，点击节点查看完整关联</p><div class="legend"><span style="--c:#32618a">核心流程</span><span style="--c:#f0784f">工具与 Hook</span><span style="--c:#8c91aa">状态与数据</span></div></header><input class="search" id="search" placeholder="搜索节点，例如 Tool" aria-label="搜索节点"><nav class="weeks" aria-label="学习周次"><a href="?">总览</a><a href="?week=1">Week 1</a><a href="?week=2">Week 2</a><a href="?week=3">Week 3</a></nav><div class="controls"><button id="reset">回到全图</button><button id="motion">重新布局</button></div><aside class="panel" id="panel" hidden><span class="tag">阅读方式</span><h2>从中心向外探索</h2><p>从左侧 CLI 启动开始，向右查看 Agent Loop 和工具执行；点击节点查看说明与完整关联。</p><p class="hint">拖动画布平移 · 滚轮缩放 · 拖动节点调整位置</p></aside><script src="graph-data.js"></script><script src="week-graphs.js"></script><script>
// Each entry can be extended as the learning journey progresses: id, category, explanation and source.
const overviewPositions={cli:[-1800,-120],args:[-1800,-360],runtime:[-1500,-120],services:[-1200,-120],sdk:[-900,-120],session:[-600,-120],session_run:[-300,-120],agent:[0,-120],loop:[300,-120],post_run:[-300,-360],manager:[-600,180],entries:[-900,420],branch:[-600,420],context:[-300,420],edits:[-300,650],stream:[300,-400],convert:[0,-600],messages:[300,-650],queues:[300,120],calls:[600,-120],prepare:[900,-250],tools:[900,-500],read:[1200,-500],before:[1200,-250],extension_bridge:[1550,-250],extension_runner:[1900,-400],extension_decision:[2200,-250],parallel:[2200,50],execute:[1850,300],update:[1850,550],after:[1500,300],after_bridge:[1500,550],tool_result_hook:[1500,800],result:[1100,300]};
// 默认显示阅读主线和分支；选中节点时再显示它的全部关联。
const secondaryLinks=new Set(['sdk|agent','calls|parallel','result|loop']);
const week=new URLSearchParams(location.search).get("week");
const graph=window.PI_WEEK_GRAPHS[week] ?? window.PI_LEARNING_GRAPH;
const positions=window.PI_WEEK_GRAPHS[week]?.positions ?? overviewPositions;
if(window.PI_WEEK_GRAPHS[week]){document.querySelector(".top h1").textContent=`Week ${week} · 源码学习`;document.querySelector(".top p").textContent="点击节点查看学习程度、说明和源码";document.querySelector("#panel h2").textContent="沿连线查看本周内容";document.querySelector("#panel p").textContent="点击节点查看说明、学习程度和源码位置；连线显示节点关系。";}
const nodes=graph.nodes.map((v,i)=>({id:v[0],label:v[1],group:v[2],description:v[3],path:v[4],x:(positions[v[0]]??[-430+(i%5)*210,450+Math.floor(i/5)*110])[0],y:(positions[v[0]]??[-430+(i%5)*210,450+Math.floor(i/5)*110])[1],vx:0,vy:0}));
const links=graph.links.map(([a,b,label])=>({a:nodes.find(n=>n.id===a),b:nodes.find(n=>n.id===b),label}));
const canvas=document.querySelector('#graph'),ctx=canvas.getContext('2d'),panel=document.querySelector('#panel');let w,h,dpr,scale=1,ox=0,oy=0,selected=null,drag=null,pan=null,moving=false,ticks=0,query='';const colors={flow:'#32618a',tool:'#f0784f',data:'#8c91aa'};
function resize(){dpr=devicePixelRatio||1;w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}function reset(){scale=Math.min(1,Math.max(.3,Math.min((w>900?w-340:w)/(window.PI_WEEK_GRAPHS[week]?2400:4300),(h-140)/1650)));ox=(w>900?(w-340)/2:w/2)+(window.PI_WEEK_GRAPHS[week]?250:-180)*scale;oy=h*.55}function screen(n){return{x:n.x*scale+ox,y:n.y*scale+oy}}function hit(x,y){return [...nodes].reverse().find(n=>{let p=screen(n),r=n.labelRect;return Math.hypot(p.x-x,p.y-y)<Math.max(12,12*scale)||(r&&x>=r.x&&x<=r.x+r.w&&y>=r.y-14&&y<=r.y+5)})}
function detail(n){selected=n;const near=links.filter(l=>l.a===n||l.b===n).map(l=>l.a===n?`${l.label} → ${l.b.label}`:`${l.a.label} → ${l.label}`);panel.innerHTML=`<button class="close" aria-label="关闭">×</button><span class="tag">${{flow:'核心流程',tool:'工具与 Hook',data:'状态与数据'}[n.group]}</span><h2></h2><p></p><div class="related"><b>关联</b><p></p><b>源码位置</b><p><a href=""></a></p></div><p class="hint">拖动节点可调整位置</p>`;panel.querySelector('h2').textContent=n.label;panel.querySelector('p').textContent=n.description;panel.querySelector('.related p').textContent=near.join(' · ');let a=panel.querySelector('a');a.href='https://github.com/earendil-works/pi/blob/9de51de45cd86ce831d271f187afd9450bf3b7ba/'+n.path;a.textContent=n.path; a.target='_blank';a.rel='noopener';panel.querySelector('.close').onclick=()=>{selected=null;panel.hidden=true};panel.hidden=false}
function tick(){if(moving && ++ticks > 240){moving=false;document.querySelector("#motion").textContent="重新布局"}if(moving){for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){let a=nodes[i],b=nodes[j],dx=b.x-a.x||.1,dy=b.y-a.y||.1,d=Math.max(20,Math.hypot(dx,dy)),f=1100/(d*d);a.vx-=dx/d*f;a.vy-=dy/d*f;b.vx+=dx/d*f;b.vy+=dy/d*f}for(const l of links){let dx=l.b.x-l.a.x,dy=l.b.y-l.a.y,d=Math.max(1,Math.hypot(dx,dy)),f=(d-150)*.0018;l.a.vx+=dx/d*f;l.a.vy+=dy/d*f;l.b.vx-=dx/d*f;l.b.vy-=dy/d*f}for(const n of nodes){n.vx=(n.vx-n.x*.0005)*.88;n.vy=(n.vy-n.y*.0005)*.88;if(drag!==n){n.x+=n.vx;n.y+=n.vy}}}ctx.clearRect(0,0,w,h);ctx.fillStyle='#cfd7df';for(let x=((ox%30)+30)%30;x<w;x+=30)for(let y=((oy%30)+30)%30;y<h;y+=30){ctx.beginPath();ctx.arc(x,y,.8,0,7);ctx.fill()}ctx.fillStyle="#8b98a8";ctx.font="600 13px sans-serif";for(const l of links){const active=selected&&(l.a===selected||l.b===selected);if(!window.PI_WEEK_GRAPHS[week]&&secondaryLinks.has(`${l.a.id}|${l.b.id}`)&&!active)continue;const a=screen(l.a),b=screen(l.b);ctx.strokeStyle=active?'#ef8669':'#cfd6de';ctx.globalAlpha=selected&&!active?.2:.8;ctx.lineWidth=active?1.8:1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}ctx.globalAlpha=1;const labelRects=[];for(const n of nodes){const p=screen(n),match=!query||n.label.toLowerCase().includes(query)||n.description.toLowerCase().includes(query);ctx.globalAlpha=match?1:.12;ctx.fillStyle=colors[n.group];ctx.beginPath();ctx.arc(p.x,p.y,(n===selected?8:5)*Math.max(.8,scale),0,7);ctx.fill();ctx.fillStyle='#47576a';ctx.font=`${Math.max(11,12*scale)}px sans-serif`;const width=ctx.measureText(n.label).width;let x=p.x+10,y=p.y+4;while(labelRects.some(r=>x<r.x+r.w+8&&x+width+8>r.x&&Math.abs(y-r.y)<18)||nodes.some(other=>{if(other===n)return false;const q=screen(other);return q.x>=x-6&&q.x<=x+width+6&&q.y>=y-16&&q.y<=y+6}))y+=20;n.labelRect={x,y,w:width};labelRects.push(n.labelRect);if(y!==p.y+4){ctx.strokeStyle='#cfd6de';ctx.beginPath();ctx.moveTo(p.x+5,p.y);ctx.lineTo(x-3,y-4);ctx.stroke()}ctx.fillText(n.label,x,y)}ctx.globalAlpha=1;requestAnimationFrame(tick)}
canvas.addEventListener('pointerdown',e=>{let n=hit(e.clientX,e.clientY);canvas.setPointerCapture(e.pointerId);canvas.classList.add('dragging');if(n){drag=n;detail(n)}else pan={x:e.clientX,y:e.clientY,ox,oy}});canvas.addEventListener('pointermove',e=>{if(drag){drag.x=(e.clientX-ox)/scale;drag.y=(e.clientY-oy)/scale;drag.vx=drag.vy=0}else if(pan){ox=pan.ox+e.clientX-pan.x;oy=pan.oy+e.clientY-pan.y}});canvas.addEventListener('pointerup',()=>{drag=null;pan=null;canvas.classList.remove('dragging')});canvas.addEventListener('wheel',e=>{e.preventDefault();const old=scale;const delta=e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?h:1);scale=Math.max(.08,Math.min(5,scale*Math.exp(-delta*.0025)));ox=e.clientX-(e.clientX-ox)*scale/old;oy=e.clientY-(e.clientY-oy)*scale/old},{passive:false});document.querySelector('#reset').onclick=reset;document.querySelector('#motion').onclick=()=>{moving=false;nodes.forEach((n,i)=>{const p=positions[n.id]??[-430+(i%5)*210,450+Math.floor(i/5)*110];n.x=p[0];n.y=p[1];n.vx=n.vy=0});reset()};document.querySelector('#search').oninput=e=>query=e.target.value.trim().toLowerCase();addEventListener('resize',resize);resize();reset();tick();
</script></body></html>
